[project]
name = "proteus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "michael.russell.ut@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "epubcheck>=5.3.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
proteus = "proteus:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
